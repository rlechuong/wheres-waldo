name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wheres_waldo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @wheres-waldo/api exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      - run: pnpm --filter @wheres-waldo/api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wheres_waldo_test

      - run: pnpm --filter @wheres-waldo/api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wheres_waldo_test
